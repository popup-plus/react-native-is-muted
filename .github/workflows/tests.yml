name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: JS unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:js

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install module dependencies
        run: npm ci

      - name: Install example app dependencies
        working-directory: example
        run: npm ci

      - name: Generate native Android project
        run: npm run prebuild:android

      - name: Run Android JVM unit tests
        working-directory: example/android
        run: ./gradlew :react-native-is-muted:testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          if-no-files-found: warn
          path: |
            android/build/reports/tests/**
            example/android/**/build/reports/tests/**
            example/node_modules/react-native-is-muted/android/build/reports/tests/**
